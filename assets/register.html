<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – ICCT SAIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="card-header">
        <h1>Create Your Account</h1>
        <p class="subtitle">Enter your student ID and password to continue</p>
      </div>

      <div class="form-grid">

        
        <div class="form-col">

          <div class="form-group">
            <label for="studentId">Student / Staff ID <span class="required">(Required)</span></label>
            <input id="studentId" type="text" placeholder="Enter your ID">
          </div>

          <div class="form-group">
            <label for="fullname">Full name</label>
            <input id="fullname" type="text" placeholder="Enter your full name">
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input id="dob" type="text" placeholder="mm-dd-yy">
          </div>

          <div class="form-group">
            <label for="department">Department/Program <span class="required">(Required)</span></label>
            <input id="department" type="text" placeholder="Computer Science e.g..">
          </div>

        </div>

     
        <div class="form-col">

          <div class="form-group">
            <label for="campus">School Campus</label>
            <input id="campus" type="text" placeholder="Antipolo Campus">
          </div>

          <div class="form-group">
            <label for="email">Institutional Email <span class="required">(Required)</span></label>
            <input id="email" type="email" placeholder="your_email@icct.edu.ph">
          </div>

          <div class="form-group">
            <label for="password">Password <span class="required">(Required)</span></label>
            <input id="password" type="password" placeholder="············">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span class="required">Required)</span></label>
            <input id="confirmPassword" type="password" placeholder="············">
          </div>

        </div>

      </div>

      
      <div class="terms-row">
        <input type="checkbox" id="terms">
        <label for="terms">
          <a href="#" class="link">Terms of Services</a> and <a href="#" class="link">Privacy Policy</a>
        </label>
      </div>

      
      <div class="btn-row">
        <a href="home.html" class="btn-create">
        <button class="btn-create" onclick="handleRegister()">Create Account</button>
        </a>
      </div>

      <div class="login-link">
        Already have an account? <a href="index.html" class="link">Sign in</a>
      </div>

    </div>
  </div>

  <script>
    function handleRegister() {
      const id       = document.getElementById('studentId').value.trim();
      const fullname = document.getElementById('fullname').value.trim();
      const email    = document.getElementById('email').value.trim();
      const dept     = document.getElementById('department').value.trim();
      const pw       = document.getElementById('password').value.trim();
      const cpw      = document.getElementById('confirmPassword').value.trim();
      const terms    = document.getElementById('terms').checked;

      if (!id || !email || !dept || !pw || !cpw) {
        alert('Please fill in all required fields.');
        return;
      }
      if (pw !== cpw) {
        alert('Passwords do not match.');
        return;
      }
      if (!terms) {
        alert('Please agree to the Terms of Services and Privacy Policy.');
        return;
      }
      alert('Account created successfully! Welcome, ' + (fullname || id) + '!');
    }
  </script>
</body>
</html>
