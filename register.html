<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – ICCT SAIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="card-header">
        <h1>Create Your Account</h1>
        <p class="subtitle">Enter your student ID and password to continue</p>
      </div>

      <div class="form-grid">

        
        <div class="form-col">

          <div class="form-group">
            <label for="studentId">Student / Staff ID <span class="required">(Required)</span></label>
            <input id="studentId" type="text" placeholder="Enter your ID">
          </div>

          <div class="form-group">
            <label for="fullname">Full name</label>
            <input id="fullname" type="text" placeholder="Enter your full name">
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input id="dob" type="text" placeholder="mm-dd-yy">
          </div>

          <div class="form-group">
            <label for="department">Department/Program <span class="required">(Required)</span></label>
            <input id="department" type="text" placeholder="Computer Science e.g..">
          </div>

        </div>

     
        <div class="form-col">

          <div class="form-group">
            <label for="campus">School Campus</label>
            <input id="campus" type="text" placeholder="Antipolo Campus">
          </div>

          <div class="form-group">
            <label for="email">Institutional Email <span class="required">(Required)</span></label>
            <input id="email" type="email" placeholder="your_email@icct.edu.ph">
          </div>

          <div class="form-group">
            <label for="password">Password <span class="required">(Required)</span></label>
            <input id="password" type="password" placeholder="············">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span class="required">Required)</span></label>
            <input id="confirmPassword" type="password" placeholder="············">
          </div>

        </div>

      </div>

      
      <div class="terms-row">
        <input type="checkbox" id="terms">
        <label for="terms">
          <a href="#" class="link">Terms of Services</a> and <a href="#" class="link">Privacy Policy</a>
        </label>
      </div>

      
      <div class="btn-row">
        <button class="btn-create" onclick="handleRegister()">Create Account</button>
      </div>

      <div class="login-link">
        Already have an account? <a href="index.html" class="link">Sign in</a>
      </div>

    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    async function handleRegister() {

  const studentId =
    document.getElementById('studentId').value.trim();

  const fullName =
    document.getElementById('fullname').value.trim();

  const email =
    document.getElementById('email').value.trim();

  const department =
    document.getElementById('department').value.trim();

  const password =
    document.getElementById('password').value;

  const confirmPassword =
    document.getElementById('confirmPassword').value;

  if(password !== confirmPassword){
    alert("Passwords do not match");
    return;
  }

  const { data, error } =
    await supabase.auth.signUp({
      email,
      password
    });

  if(error){
    alert(error.message);
    return;
  }

  const { error: dbError } =
    await supabase
      .from('students')
      .insert([
        {
          student_id: studentId,
          full_name: fullName,
          email: email,
          department: department
        }
      ]);

  if(dbError){
    alert(dbError.message);
    return;
  }

  alert("Account created successfully!");
  window.location.href = "index.html";
}
  </script>
</body>
</html>
