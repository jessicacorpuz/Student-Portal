<!DOCTYPE html>
<html>
<head>
<title>Student Academic Information System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="left">
    <div class="logo">
        <img src="https://jaredbona.github.io/emt-project/img/ICCT.png" width="200">
        <h1>ICCT</h1>
        <p>Student Academic Information System</p>
    </div>
</div>

<div class="right">
    <div class="navbar">
        <button onclick="showsection('home')">Home</button>
        <button onclick="showsection('aboutus')">About Us</button>
        <button onclick="showsection('dashboard')">Student Dashboard</button>
        <button onclick="showsection('notification')"><img src="https://uxwing.com/wp-content/themes/uxwing/download/communication-chat-call/bell-line-icon.png" width="15"></button>
        <button onclick="showsection('helpcenter')">Help Center</button>
    </div>

    <div id="login" class="section active">
        <div class="login">
            <h2>Login</h2>
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button class="mainbutton" onclick="login()">Login</button>
            <button class="altbutton" onclick="window.close()">Exit</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
