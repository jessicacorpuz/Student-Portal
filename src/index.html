
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Academic Information System – ICCT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <div class="page">
    <div class="card">

    
      <div class="panel-left">
        <img class="bg-img"
             src="https://icct.edu.ph/wp-content/uploads/2018/12/Antipolo.png"
             alt="ICCT Antipolo Campus">
        <div class="overlay"></div>

        <div class="logo-row">
          <img src="https://jaredbona.github.io/emt-project/img/ICCT.png" alt="ICCT Logo">
          <span>ICCT Colleges<br>Antipolo Campus</span>
        </div>

        <div class="hero-text">
          <h2>Welcome Back</h2>
          <p>Access your grades, schedule, and announcements all in one place.</p>
          <div class="feature-pills">

            <div class="pill" onclick="alert('Redirecting to Modules…')">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v9a1 1 0 01-1 1H3a1 1 0 01-1-1V4z" stroke="white" stroke-width="1.4"/><path d="M1 2h14" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
              Explore Modules
            </div>

            <div class="pill" onclick="alert('Redirecting to Grades…')">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1" stroke="white" stroke-width="1.4"/><path d="M5 8h6M5 5h6M5 11h4" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
              Track Grades
            </div>

            <div class="pill" onclick="alert('Redirecting to Notifications…')">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2a6 6 0 100 12A6 6 0 008 2z" stroke="white" stroke-width="1.4"/><path d="M8 5v3l2 2" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
              Stay Notified
            </div>

          </div>
        </div>
      </div>

      
      <div class="panel-right">
        <h1>Sign in to your account</h1>
        <p class="subtitle">Enter your student ID and password to continue</p>

        <div class="form-group">
          <label for="studentId">Student / Staff ID</label>
          <input id="studentId" type="text" placeholder="Enter your ID / Email" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
        </div>

        <div class="remember-row">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>
       <a href="assets/home.html" class="btn-login">
        <button class="btn-login" onclick="handleLogin()">Log in</button>
         </a>
          
        

        <div class="forgot-link"><a href="#">Forgot password</a></div>

        <div class="divider"><hr><span>or</span><hr></div>
        <a href="assets/register.html" class="btn-create">
            <button class="btn-create" onclick="handleCreateAccount()">Create Account</button>
        </a>
        

        <div class="help-link">Need help? <a href="#">Contact support</a></div>
      </div>

    </div>
  </div>

  <script>
    function handleLogin() {
      const id = document.getElementById('studentId').value.trim();
      const pw = document.getElementById('password').value.trim();
      if (!id || !pw) {
        alert('Please enter your Student ID and password.');
        return;
      }
      alert('Logging in as: ' + id);
    }

    function handleCreateAccount() {
      alert('Redirecting to account registration…');
    }
  </script>
</body>
</html>
